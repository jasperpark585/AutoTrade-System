mode: DRY-RUN
scan_interval_seconds: 60
portfolio_refresh_interval_sec: 300

universe:
  default_symbols:
    - "005930"
    - "000660"
    - "035420"
    - "207940"
    - "003490"
    - "012330"

risk_limits:
  max_daily_trades: 8
  max_orders_per_day: 8
  max_positions: 4
  max_buy_amount_per_trade_krw: 1500000
  max_buy_amount_per_trade: 1500000

scoring_weights:
  universe: 20
  pre_breakout: 25
  trigger: 30
  confirmation: 25

stages:
  universe:
    max_spread_pct: 1.2
  pre_breakout:
    volume_spike_ratio_min: 2.2
    intraday_volatility_pct_min: 1.8
  trigger:
    breakout_zone_1_pct: 0.6
    breakout_zone_2_pct: 1.2
    breakout_zone_3_pct: 2.0
  confirmation:
    execution_strength_min: 105
    spread_pct_max: 0.9
    trend_slope_min: 0.2
  exit:
    stop_loss_pct: 1.8
    take_profit_pct: 4.2

small_cash_profile:
  enabled: true
  force_enabled: false
  auto_switch:
    enabled: true
    threshold_orderable_cash_krw: 300000
  overrides:
    risk_limits:
      max_positions: 2
      max_buy_amount_per_trade_krw: 120000
      max_buy_amount_per_trade: 120000

gpt_scout:
  enabled: true
  allow_external_call: true
  premarket_refresh_time_kst: "08:20"
  max_candidates: 8
  max_output_tokens: 900
  prefer_price_krw: 40000
  price_cap_krw: 120000
  overheat_score_limit: 75
  overheat_volatility_pct: 6.5
  notify_on_refresh: true
  model: "gpt-4.1-mini"
  user_context: "급등 초기 진입 우선, 이미 과열된 종목 배제"
  quota_guard:
    enabled: true
    require_paid_opt_in: true
    paid_opt_in_env: "OPENAI_PAID_ALLOWED"
    max_requests_per_day: 3
    max_requests_per_month: 40
    max_monthly_cost_usd: 5.0
    reserve_ratio: 0.9
    max_estimated_cost_per_call_usd: 0.30
    estimated_prompt_tokens_per_call: 1200
    estimated_completion_tokens_per_call: 500
    cooldown_minutes_on_http_429: 360
    pricing_per_1m_tokens:
      input_usd: 0.40
      output_usd: 1.60

position_management:
  trailing_stop_pct: 1.7
  min_gain_for_trailing_pct: 0.8
  max_pullback_from_peak_pct: 1.4
  weak_trend_exit_slope: -0.1
  max_holding_hours: 18

hourly_alert:
  enabled: true
  minute: 0
  grace_minutes: 8
