mode: DRY-RUN
scan_interval_seconds: 60
portfolio_refresh_interval_sec: 300

risk_limits:
  max_daily_trades: 8
  max_orders_per_day: 8
  max_positions: 4
  max_buy_amount_per_trade_krw: 1500000
  max_buy_amount_per_trade: 1500000

scoring_weights:
  universe: 20
  pre_breakout: 25
  trigger: 30
  confirmation: 25

stages:
  universe:
    max_spread_pct: 1.2
  pre_breakout:
    volume_spike_ratio_min: 2.2
    intraday_volatility_pct_min: 1.8
  trigger:
    breakout_zone_1_pct: 0.6
    breakout_zone_2_pct: 1.2
    breakout_zone_3_pct: 2.0
  confirmation:
    execution_strength_min: 105
    spread_pct_max: 0.9
    trend_slope_min: 0.2
  exit:
    stop_loss_pct: 1.8
    take_profit_pct: 4.2

small_cash_profile:
  enabled: true
  force_enabled: false
  auto_switch:
    enabled: true
    threshold_orderable_cash_krw: 300000
  overrides:
    risk_limits:
      max_positions: 2
      max_buy_amount_per_trade_krw: 120000
      max_buy_amount_per_trade: 120000
