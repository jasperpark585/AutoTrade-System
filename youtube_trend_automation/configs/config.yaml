app:
  timezone: Asia/Seoul
  log_level: INFO
  allow_network: false

collection:
  google_trends_limit: 10
  google_trends_geo: KR
  naver_sections:
    - 100
    - 101
    - 102
    - 103
    - 104
    - 105
  fallback_topics:
    - AI 에이전트
    - 국내 증시
    - 반도체 주가
    - 서울 부동산
    - 건강보험 개편
    - KBO 하이라이트

scoring:
  top_k: 5
  duplicate_similarity_threshold: 0.82
  source_weights:
    google_trends: 1.35
    naver_news: 1.15
    fallback: 0.85
    quotes: 1.0
    poems: 1.0

generation:
  language: ko
  max_tags: 12
  script_sections: 12
  title_prefix: "[오늘의 트렌드 브리핑]"
  title_suffix: "핵심만 3분 정리"
  channel_name: "오늘의 트렌드 브리핑"
  call_to_action: "매일 핵심 이슈를 빠르게 받고 싶다면 구독과 알림 설정을 눌러주세요."
  description_include_score: false
  description_include_sources: false
  description_include_generation_note: false
  generation_note: "이 영상은 공개 트렌드 데이터를 바탕으로 자동 생성된 브리핑입니다."
  target_duration_seconds: 180

ai:
  enabled: true
  text_model: gpt-5
  image_model: gpt-5
  use_text_generation: true
  use_image_generation: true

tts:
  enabled: true
  provider: edge-tts
  voice: ko-KR-SunHiNeural
  rate: +0%

render:
  enabled: true
  width: 1080
  height: 1920
  fps: 30
  default_duration_seconds: 180

thumbnail:
  enabled: true
  width: 1280
  height: 720
  label: "TREND NOW"
  footer: "AUTO NEWS STUDIO"

youtube:
  enabled: false
  privacy_status: private
  category_id: "25"
  default_language: ko
  default_audio_language: ko-KR
  made_for_kids: false
  altered_content_mode: auto
  contains_synthetic_media: false
  caption_certification_hint: "이 콘텐츠는 미국 텔레비전에서 방영된 적이 없습니다."

scheduler:
  hours: 6

studio:
  settings_file: data/studio_settings.json
